global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by:
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url: "YOUR_DISCORD_WEBHOOK_HERE"
        send_resolved: true

        title: "{{ .CommonLabels.alertname }}"

        message: |
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**

          {{ .Annotations.description }}

          Instance: {{ .Labels.instance }}
          Severity: {{ .Labels.severity }}

          {{ end }}

templates:
  - '/etc/alertmanager/templates/*.tmpl'
