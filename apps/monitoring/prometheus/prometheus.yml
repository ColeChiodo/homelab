global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:

  - job_name: proxmox
    static_configs:
      - targets:
          - 192.168.1.10:9100

  - job_name: homelab
    static_configs:
      - targets:
          - 192.168.1.20:9100

  - job_name: clients
    static_configs:
      - targets:
          - 192.168.1.30:9100

   - job_name: pve
    static_configs:
      - targets:
          - pve-exporter:9221

  - job_name: blackbox

    metrics_path: /probe

    params:
      module:
        - http_2xx

    static_configs:
      - targets:
          - https://nextcloud.yourdomain.com
          - https://vaultwarden.yourdomain.com
          - https://jellyfin.yourdomain.com
          - https://seerr.yourdomain.com
          - https://immich.yourdomain.com

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115
