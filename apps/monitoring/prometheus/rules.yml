groups:

###############################################################################
# Infrastructure
###############################################################################

- name: infrastructure
  rules:

  - alert: HostDown
    expr: up == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "{{ $labels.job }} is down"
      description: "{{ $labels.instance }} has not responded for 5 minutes."

###############################################################################
# Node Exporter
###############################################################################

- name: node
  rules:

  - alert: HighCPUUsage
    expr: (100 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]) * 100)) > 90
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "High CPU on {{ $labels.instance }}"
      description: "CPU usage has exceeded 90%."

  - alert: HighMemoryUsage
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage on {{ $labels.instance }}"
      description: "Memory usage has exceeded 90%."

  - alert: DiskSpaceLow
    expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Low disk space on {{ $labels.instance }}"
      description: "Less than 15% disk space remaining."

  - alert: DiskSpaceCritical
    expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 5
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Disk almost full on {{ $labels.instance }}"
      description: "Less than 5% disk space remaining."

###############################################################################
# Docker (cAdvisor)
###############################################################################

- name: docker
  rules:

  - alert: ContainerMissing
    expr: absent(container_last_seen)
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "A monitored container disappeared"

  - alert: ContainerRestarting
    expr: increase(container_restart_count_total[15m]) > 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.name }} is restarting repeatedly"

  - alert: ContainerHighCPU
    expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) > 1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.name }} CPU usage is high"

###############################################################################
# Proxmox
###############################################################################

- name: proxmox
  rules:

  - alert: ProxmoxExporterDown
    expr: up{job="pve"} == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Proxmox exporter is down"

###############################################################################
# Blackbox Exporter (future)
###############################################################################

- name: blackbox
  rules:

  - alert: WebsiteDown
    expr: probe_success == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "{{ $labels.instance }} is unreachable"

  - alert: HTTP500
    expr: probe_http_status_code >= 500
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.instance }} returned HTTP {{ $value }}"

  - alert: SSLExpiringSoon
    expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 14
    labels:
      severity: warning
    annotations:
      summary: "SSL certificate expires within 14 days"

###############################################################################
# Prometheus
###############################################################################

- name: monitoring
  rules:

  - alert: PrometheusTargetMissing
    expr: prometheus_target_interval_length_seconds == 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "A Prometheus scrape target disappeared"
