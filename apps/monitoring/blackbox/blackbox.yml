modules:
  http_2xx:
    prober: http
    timeout: 5s

    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []
      method: GET
      follow_redirects: true

  https_2xx:
    prober: http
    timeout: 5s

    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []
      fail_if_ssl: false
