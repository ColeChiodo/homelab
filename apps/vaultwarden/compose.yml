services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped

    ports:
      - "8087:80"

    volumes:
      - /srv/vaultwarden:/data

    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
      TZ: "America/Los_Angeles"

    networks:
      - proxy

networks:
  proxy:
    external: true
